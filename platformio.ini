;
; ESP32-S3 DIY ELECTRONIC DRUM MODULE
; PlatformIO project configuration
;
; Target : ESP32-S3 Super Mini (ESP32-S3FH4R2 / 4 MB flash, no PSRAM assumed)
; Core   : Arduino framework.  espressif32@6.9.0 installs arduino-esp32 2.0.17
;          (ESP-IDF 4.4.7).  The I2S layer also compiles against arduino-esp32 3.x
;          (ESP-IDF 5.x) - see src/hal/audio_out.cpp.
;
; Build:  pio run
; Upload: pio run -t upload
; Serial: pio device monitor
;

[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags =
	-std=gnu++11
	-std=gnu++14
build_flags =
	-std=gnu++17
	-Wall
	-DCORE_DEBUG_LEVEL=0
	; Native USB-Serial/JTAG of the ESP32-S3 (the Super Mini has no USB-UART chip)
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; The radio is never started by this firmware, so ~60 kB of heap stays free
lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit BusIO @ ^1.16.1

; ---------------------------------------------------------------------------
; Default build: 4 MB flash, no PSRAM (samples are kept in internal SRAM)
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; 3 MB application partition (no OTA needed; audio lives on the SD card)
board_build.partitions = huge_app.csv
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=0

; ---------------------------------------------------------------------------
; Optional build for boards that DO have PSRAM (ESP32-S3FH4R2).
; The sample pool is then allocated in PSRAM, which raises the sample
; capacity from ~160 kB to several MB.  Not required - the firmware runs
; unchanged on a plain 4 MB board.
; ---------------------------------------------------------------------------
[env:esp32s3-psram]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM=1
	-DAUDIO_POOL_BYTES=1400000

; ---------------------------------------------------------------------------
; Host build used by tests/host/run_tests.sh - compiles the pure C++ core
; modules with g++ so the DSP / parsing / trigger logic can be unit tested
; on a PC without hardware.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags = -std=gnu++17 -O1 -Wall -Wextra
